services:
  - type: web
    name: framelink-license-admin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FRAMELINK_SIGNING_KEY
        sync: false
      - key: FRAMELINK_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRAMELINK_REQUIRE_POSTGRES
        value: "true"
